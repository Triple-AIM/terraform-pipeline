name: 'Credentials'
description: >-
  Credentials for the self-test. The fixtures need none. The config exports
  each environment's user, from a variable. This checks that it arrived, and
  that it is the right environment's.

inputs:
  root:
    description: 'The root being planned or applied, relative to the repository.'
    required: true
  vars:
    description: "The job's variables as JSON, including the environment's."
    required: true

runs:
  using: composite
  steps:
  # Each self-test environment holds a user named for the job that uses it.
  # So a value from the wrong environment fails here. The job's name comes
  # from the pipeline, not from the environment, so it is a fair check.
  - name: Check the environment's user
    shell: bash
    env:
      JOB: ${{ github.job }}
      VARS: ${{ inputs.vars }}
    run: |
      if [ "$SELF_TEST_USER" != "self-test-$JOB-user" ]; then
        echo "::error::SELF_TEST_USER is not the $JOB environment's."
        exit 1
      fi
      # Printed, so that the log shows whether GitHub masks them. The control
      # is masked here, so the log shows what a masked value looks like.
      control="self-test-control-$(openssl rand -hex 8)"
      echo "::add-mask::$control"
      echo "Control: $control"
      echo "User: $SELF_TEST_USER"
      jq -e 'type == "object"' <<<"$VARS" > /dev/null
