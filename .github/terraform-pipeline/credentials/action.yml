name: 'Credentials'
description: >-
  Credentials for the self-test. The fixtures need none. The config exports
  each environment's key, as it would for a provider without OIDC. It also
  exports each environment's user, from a variable. This checks that both
  arrived, and that they are the right environment's.

inputs:
  root:
    description: 'The root being planned or applied, relative to the repository.'
    required: true
  secrets:
    description: "The job's secrets as JSON, including the environment's."
    required: true
  vars:
    description: "The job's variables as JSON, including the environment's."
    required: true

runs:
  using: composite
  steps:
  # Each self-test environment holds a key and a user named for the job that
  # uses it. So a value from the wrong environment fails here. The job's name
  # comes from the pipeline, not from the environment, so it is a fair check.
  - name: Check the environment's key and user
    shell: bash
    env:
      JOB: ${{ github.job }}
      VARS: ${{ inputs.vars }}
    run: |
      if [ -z "$SELF_TEST_API_KEY" ]; then
        echo "::error::The environment's SELF_TEST_API_KEY did not arrive."
        exit 1
      fi
      if [ "$SELF_TEST_API_KEY" != "self-test-$JOB-key" ]; then
        echo "::error::SELF_TEST_API_KEY is not the $JOB environment's."
        exit 1
      fi
      if [ "$SELF_TEST_USER" != "self-test-$JOB-user" ]; then
        echo "::error::SELF_TEST_USER is not the $JOB environment's."
        exit 1
      fi
      # Printed, so that the log shows whether GitHub masks them.
      echo "Key: $SELF_TEST_API_KEY"
      echo "User: $SELF_TEST_USER"
      jq -e 'type == "object"' <<<"$VARS" > /dev/null
