version: 2
updates:
  # Every action is pinned to a commit. The Checkov image is pinned by digest
  # inside a script, where Dependabot does not look. So it is updated by hand.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/prepare-terraform
      - /.github/actions/install-comparison
      - /.github/terraform-pipeline/credentials
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: gomod
    directory: /.github/actions/install-comparison
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
