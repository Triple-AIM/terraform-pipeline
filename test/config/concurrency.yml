# For the claim that runs wait for each other. Two calls of the pipeline use
# this config at once. It plans one small root, so that the claim is quick.
terraform-version: "1.16.1"
providers:
  hashicorp/random:
root-directory: test/roots/nested
environments:
  plan: self-test-plan
  apply: self-test-apply
environment-variables:
  SELF_TEST_API_KEY: SELF_TEST_API_KEY
  SELF_TEST_USER: { variable: SELF_TEST_USER }
