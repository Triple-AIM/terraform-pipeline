# The config of the self-test that runs as a consumer would. Its environments
# allow only the default branch.
terraform-version: "1.16.1"
providers:
  hashicorp/random:
root-directory: test/roots
# Every root is planned on every change, as in the self-test.
shared-paths:
  - .
environments:
  plan: terraform-plan
  apply: terraform-apply
  modules: terraform-modules
# The self-test's App, which can only read the test module's repository.
private-modules:
  client-id: Iv23liwmfTe5Z6qNmSfH
  private-key-secret: SELF_TEST_MODULES_APP_KEY
environment-variables:
  SELF_TEST_API_KEY: SELF_TEST_API_KEY
  SELF_TEST_USER: { variable: SELF_TEST_USER }
