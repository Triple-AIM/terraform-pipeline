# The self-test's config. Its environments let any branch use them, so that a
# pull request can test its own pipeline. They hold nothing.
terraform-version: "1.16.1"
providers:
  hashicorp/random:
root-directory: test/roots
environments:
  plan: self-test-plan
  apply: self-test-apply
  modules: self-test-modules
  # This exists but requires no reviewer. So the pipeline should refuse it.
  approval: self-test-approve
# The App can only read the test module's repository. Its key is in the plan,
# apply and modules environments.
private-modules:
  client-id: Iv23liwmfTe5Z6qNmSfH
environment-variables:
  SELF_TEST_USER: { variable: SELF_TEST_USER }
checkov: true
checkov-config: test/checkov.yml
