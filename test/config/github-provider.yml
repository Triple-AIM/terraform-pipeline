# The integrations/github provider reads its settings from `GITHUB_` names
# that the runner does not set.
terraform-version: "1.16.1"
providers:
  integrations/github:
environment-variables:
  GITHUB_APP_ID: { variable: TERRAFORM_GITHUB_APP_ID }
  GITHUB_APP_INSTALLATION_ID: { variable: TERRAFORM_GITHUB_APP_INSTALLATION_ID }
