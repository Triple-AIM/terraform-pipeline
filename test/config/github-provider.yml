# The integrations/github provider reads its credentials from `GITHUB_`
# names that the runner does not set.
terraform-version: "1.16.1"
providers:
  integrations/github:
environment-variables:
  GITHUB_APP_ID: TERRAFORM_GITHUB_APP_ID
  GITHUB_APP_INSTALLATION_ID: TERRAFORM_GITHUB_APP_INSTALLATION_ID
  GITHUB_APP_PEM_FILE: TERRAFORM_GITHUB_APP_PEM_FILE
  GITHUB_TOKEN: TERRAFORM_GITHUB_TOKEN
